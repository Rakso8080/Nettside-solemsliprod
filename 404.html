<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="Solemsli production.png">
  <meta name="theme-color" content="#0180ff">
  <link rel="manifest" href="manifest.json">
  <meta name="description" content="Siden ble ikke funnet.">
  <meta property="og:title" content="404 - Solemsli Productions" />
  <meta property="og:description" content="Siden du leter etter finnes ikke." />
  <meta property="og:image" content="https://rakso8080.github.io/Nettside-solemsliprod/uranustind.jpg" />
  <title>404 - Siden ble ikke funnet | Solemsli Productions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
    .error-code{font-size:clamp(6rem,15vw,12rem);font-weight:800;background:linear-gradient(135deg,var(--main-blue),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;letter-spacing:-5px;margin-bottom:20px;animation:fadeUp .8s forwards;transform:translateY(30px)}
    h1{font-size:clamp(1.5rem,3vw,2.5rem);font-weight:700;margin-bottom:15px;animation:fadeUp .8s .1s forwards;opacity:0;transform:translateY(30px)}
    .error-desc{color:var(--text-muted);font-size:1.1rem;max-width:400px;margin:0 auto 40px;line-height:1.6;animation:fadeUp .8s .2s forwards;opacity:0;transform:translateY(30px)}
    .buttons{display:flex;gap:15px;justify-content:center;animation:fadeUp .8s .3s forwards;opacity:0;transform:translateY(30px)}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){.buttons{flex-direction:column;align-items:center}}
  </style>
</head>
<body>
  <div id="grain"></div>
  <div class="cursor-glow" id="cursor-glow"></div>
  <div class="custom-cursor" id="cursor"></div>
  <div class="custom-cursor-dot" id="cursor-dot"></div>

  <div class="error-code">404</div>
  <h1 data-no="Siden ble ikke funnet" data-en="Page not found" data-de="Seite nicht gefunden">Siden ble ikke funnet</h1>
  <p class="error-desc" data-no="Siden du leter etter finnes ikke, eller er blitt flyttet." data-en="The page you're looking for doesn't exist or has been moved." data-de="Die gesuchte Seite existiert nicht oder wurde verschoben.">Siden du leter etter finnes ikke, eller er blitt flyttet.</p>
  <div class="buttons">
    <a href="index.html" class="btn btn-primary magnetic" data-no="Tilbake til hjem" data-en="Back to home" data-de="Zurueck zur Startseite">Tilbake til hjem</a>
    <a href="contact.html" class="btn btn-outline magnetic" data-no="Kontakt meg" data-en="Contact me" data-de="Kontaktiere mich">Kontakt meg</a>
  </div>

  <script src="shared.js"></script>
</body>
</html>
